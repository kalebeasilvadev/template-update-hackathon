<ul [class.expanded]="menuOpen === true" role="navigation" aria-label="Menu principal">
	@for (menuItem of menu; track menuItem) {
		<li>
			<a routerLink="{{ menuItem.link }}"
				(click)="toggleMenu()"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ exact: true }" [attr.aria-label]="'Ir para ' + menuItem.link">{{ menuItem.title }}</a
			>
		</li>
	}
</ul>
