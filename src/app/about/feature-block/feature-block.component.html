<div class="col-2 icon-block icon-top wow fadeInUp" data-wow-delay="0.1s" tabindex="0" [attr.aria-label]="'Descrição do ' + feature.title" role="region" aria-labelledby="feature.title">
	<!--Icon-->
	<div class="icon" tabindex="0" [attr.aria-label]="'Descrição do ' + feature.title" role="region" aria-labelledby="feature.title">
		<i class="fa fa-{{ feature.icon }} fa-2x" [attr.aria-label]="'Ícone de ' + feature.icon"></i>
	</div>
	<!--Icon Block Description-->
	<div class="icon-block-description" tabindex="0" [attr.aria-label]="'Descrição do ' + feature.title" role="region" aria-labelledby="feature.title">
		<h1 [attr.aria-label]="feature.title">{{ feature.title }}</h1>
		<p>{{ feature.description }}</p>
	</div>
</div>
