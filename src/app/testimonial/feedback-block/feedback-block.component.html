<blockquote class="col-3 testimonial classic" [attr.aria-label]="'Depoimento de ' + feedback.name">
	<img src="assets/images/user-images/{{ feedback.userimage }}" tabindex="0" alt="{{ feedback.alt || 'Imagem relacionada ao conteúdo' }}" />
	<q>{{ feedback.comments }}</q>
	<footer>{{ feedback.name }} - {{ feedback.company }}</footer>
</blockquote>
